# qa-response.yml — caller of claude.directives' shared-qa-response.yml (#460
# step 4 pilot): event-driven QA started by repository_dispatch or by hand.
# Pinned to an exact claude.directives commit, not a tag (owner, 2026-10-25).
# Rollback is reverting the pilot PR.
#
# This caller keeps the triggers. A repository_dispatch carries no revision, so
# it tests the default branch, never the branch a session dispatched from; the
# shared workflow says so in its step summary. Never take a ref from
# client_payload. Secrets go by name, never `secrets: inherit`; leave both
# unset on this repo (qa.yml header, CLAUDE.md credential row).
name: QA — Event-Driven Response

on:
  repository_dispatch:
    types:
      - qa-email-received       # triggered when Gmail monitor detects a relevant email
      - test-failure-reported   # triggered when another workflow reports a failure
      - manual-qa-trigger       # triggered manually by an active session
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual session trigger'

permissions:
  contents: read

jobs:
  respond:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-response.yml@55af14e497d7490b7b0d83cf0528f33659df9b41
    with:
      tests-dir: .github/scripts/ui-tests
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
