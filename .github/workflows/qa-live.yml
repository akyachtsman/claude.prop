# qa-live.yml — caller of claude.directives' shared-qa-live.yml (#460 step 4
# pilot): Playwright against the live deployed URL after each Pages build, and
# by manual dispatch. Pinned to an exact claude.directives commit, not a tag
# (owner, 2026-10-25). Rollback is reverting the pilot PR.
#
# This caller keeps the triggers, because they name this project's own deploy:
# branch-source Pages, so the watched workflow is GitHub's managed
# 'pages-build-deployment'. It grants `actions: read` for the shared
# published-lookup job (a called workflow can only narrow the caller's token).
# No `concurrency` here: the old copy's rule now sits on the shared suite job.
#
# ⚠️ The live suite needs the repository VARIABLE APP_URL (not a secret); the
# shared workflow's "Require APP_URL" step fails in seconds without it. See
# the App URL row in CLAUDE.md. Secrets go by name, never `secrets: inherit`;
# leave both unset on this repo (qa.yml header, CLAUDE.md credential row).
name: QA — UI Tests (live)

on:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  live:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-live.yml@f667e89d7a8b86ce1e269489d03da20261e9fd79
    with:
      tests-dir: .github/scripts/ui-tests
      app-url: ${{ inputs.app_url }}
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
