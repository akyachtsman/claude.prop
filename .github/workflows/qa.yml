# qa.yml — caller of claude.directives' shared-qa.yml (#460 step 4 pilot).
# The shared workflow runs the secret scan, the contrast guardrail (this project's
# own script, via contrast-script) and the Playwright suite against a local
# server; its jobs show as "qa / Static Checks" and "qa / UI Tests (local
# server)". What it does and how it differs from the old copy:
# claude.directives docs/internal/shared-workflows.md.
#
# Pinned to an exact claude.directives commit, not a tag (owner, 2026-10-25):
# v1.1.0's commit, which adds the web guards (claude.directives #493). The
# qa-live and qa-response callers stay on 55af14e.
# Rollback is reverting the pilot PR, which restores the full copy.
#
# Settings the old copy kept in `env:` are `with:` inputs below, because `env`
# does not pass into a called workflow. BUILD_PATHS stays in the top-level
# `env:`: the toolkit's Pages edit reminder reads it there, no workflow does.
#
# PROJECT-SPECIFIC: the `project-checks` job carries the two checks the old
# copy ran in its Static Checks job that the shared workflow takes no command
# for (see CLAUDE.md): the root-absolute path guard and the Node unit tests.
# `qa` waits on it, so a red project check stops the suite; a sibling job in
# `needs` is the documented slot for project checks (claude.directives #479).
#
# Contrast: `contrast-script` makes the shared Static Checks run this project's
# own .github/scripts/check-contrast.js (13 pairs: upstream's plus four marked
# `// PROJECT-SPECIFIC` in the file) instead of the shipped one. That copy and
# the commonjs package.json beside it stay in the repo.
#
# Secrets go by name, never `secrets: inherit` (claude.directives #467).
# ⚠️ LOCAL OVERRIDE — DO NOT set TEST_AUTH_CREDENTIAL or TEST_AUTH_EMAIL on this
# repo. The generic suite signs itself in (app.spec.js beforeEach ->
# installSignedIn), so no gate is ever on screen, mechanism resolves to 'none',
# and S2 skips by design. Setting either one makes S2 FAIL (re-measured
# 2026-10-05): upstream's discriminating guard turns "credentials configured but
# no gate" into a hard error. So if CI goes red on S2 right after someone sets
# one of these secrets, the secret IS the cause and removing it is the fix. The
# coverage is redundant with auth.spec.js S23-S28. See the credential row in
# CLAUDE.md.

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Extended regex of the build INPUTS. Not read by any workflow: the toolkit's
  # Pages edit reminder reads it to know which edits change the deployed site.
  # Empty: no build (branch-source Pages).
  BUILD_PATHS: ''

jobs:
  project-checks:
    name: Project Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── Root-absolute path guard (PROJECT-SPECIFIC — see CLAUDE.md) ─────────
      # Pages serves this project under /claude.prop/, so a leading-slash URL
      # resolves to the domain root and 404s. Such a path is green against the
      # local server (rooted at /) and red only against the live site, so the
      # local tier structurally cannot catch it — this guard can.
      - name: No root-absolute paths (breaks the /claude.prop/ Pages sub-path)
        run: |
          set -euo pipefail
          # Fail loudly if a scanned path vanishes — grep's exit 2 would
          # otherwise read as "no hits" and the guard would stop guarding.
          for path in .github/scripts/ui-tests/tests index.html js styles; do
            [ -e "$path" ] || { echo "ERROR: guard cannot scan missing $path"; exit 1; }
          done
          # Match the SHAPE of a root-absolute URL, not a list of consumers:
          #   1. a root-absolute literal in any of JS's three string forms
          #      (' " `), in a value position;
          #   2. CSS url() unquoted, which carries no delimiter;
          #   3. an unquoted HTML attribute — constrained to markup context
          #      (inside a <tag ...>), because without that `const src = /re/`
          #      in plain JS reads as an attribute and the guard rejects valid
          #      code. js/vendor/ is skipped: a pinned third-party bundle whose
          #      own paths resolve against its host, not this Pages sub-path.
          #
          # KNOWN LIMIT: a path assembled from a bare slash — fetch('/' + p) —
          # is not detected. Matching a standalone '/' would flag every
          # legitimate one (split('/'), path joins). Closing that needs
          # syntax-aware scanning, not a regex; see CLAUDE.md.
          rc=0
          hits=$(grep -rnE "(^|[[:space:](=,:[])['\"\`]/[^/'\"\`[:space:]]|url\(\s*/[^/[:space:])]|<[a-zA-Z][^>]*[[:space:]](src|href|action|poster|srcset|formaction|manifest)[[:space:]]*=[[:space:]]*/[^/[:space:]>]" \
                   --exclude-dir=vendor \
                   .github/scripts/ui-tests/tests index.html js styles) || rc=$?
          # grep: 0 = matched, 1 = no match, >=2 = operational error. Treating
          # >=2 as "no match" (what `|| true` does) lets a broken matcher pass
          # the blocking gate silently — the failure this guard exists to avoid.
          if [ "$rc" -ge 2 ]; then
            echo "ERROR: guard did not run (grep exit $rc) — matcher or paths are broken"
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "ERROR: root-absolute path found — use an app-relative URL"
            echo "       (e.g. new URL('js/store.js', document.baseURI).href)"
            exit 1
          fi

      # ── Store unit tests (PROJECT-SPECIFIC — see CLAUDE.md) ─────────────────
      # Node-native tests for the storage layer, reconcile, math input, media
      # and import parsing. Browser-free — shims localStorage/navigator — so
      # they run here in the blocking gate.
      - name: Unit tests (store + reconcile + mathinput + media + importparse)
        run: node --test tests/store.test.mjs tests/reconcile.test.mjs tests/mathinput.test.mjs tests/media.test.mjs tests/importparse.test.mjs

  qa:
    needs: [project-checks]
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa.yml@d32a9d0cb6f17b77c3771503ec0bfe95931c9043  # v1.1.0
    with:
      # Path to the directory containing playwright.config.js and package.json
      tests-dir: .github/scripts/ui-tests
      # No build: branch-source Pages, the repo root is served.
      build-cmd: ''
      site-dir: '.'
      contrast-args: ''
      # This project's copy, with its four added pairs, runs instead of the shared one.
      contrast-script: .github/scripts/check-contrast.js
      # Blocking: the suite runs fully against the bundled local server.
      advisory-run: false
      # The fleet floor for a ui-suite caller; raise it, never lower it.
      ui-timeout-minutes: 120
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
